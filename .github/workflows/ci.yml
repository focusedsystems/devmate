# Builds the package and runs its tests on every push to main and every pull
# request, and checks that nothing private has entered this public repository.
# Apps pin DevMate to a commit on main.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zone:
    name: Zone check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the checker
        run: python3 scripts/zone_check.py --self-test

      - name: Check tracked files
        run: python3 scripts/zone_check.py

      - name: Check this pull request's commits and text
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          python3 scripts/zone_check.py --messages "$BASE..$HEAD"
          printf '%s\n%s\n' "$TITLE" "$BODY" | python3 scripts/zone_check.py --stdin

  build:
    name: Build and test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select newest Xcode 27
        run: sudo xcode-select -s "$(ls -d | sort -V | tail -1)"

      - name: Build
        run: swift build -c release

      - name: Test
        run: swift test
