# Copy to .github/workflows/devmate-sync.yml in an app that pins DevMate by
# revision, and set APP_PRODUCT. The app needs a ci.yml with workflow_dispatch.
#
# Upstream code runs only where no write access exists:
#   check   - read-only, runs nothing from DevMate, compares the pin with main.
#   build   - read-only token, no persisted credentials. Builds the app and runs
#             its tests against DevMate's main.
#   publish - holds the write token and never builds or runs DevMate code. It
#             moves the pin, opens or updates the pull request, starts ci.yml,
#             waits for that run to pass, and merges that exact commit.
#
# The merge waits for the run itself rather than using auto-merge, because
# auto-merge does not wait on a branch with no required checks.

name: devmate-sync

on:
  schedule:
    - cron: "37 9 * * *"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: devmate-sync
  cancel-in-progress: false

permissions: {}

env:
  UPSTREAM: https://github.com/focusedsystems/devmate.git
  BRANCH: chore/devmate-sync
  APP_PRODUCT: ExampleApp

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      revision: ${{ steps.compare.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Compare the pin with DevMate main
        id: compare
        run: |
          pinned=$(grep -oE 'devmate\.git", revision: "[0-9a-f]{40}"' Package.swift | grep -oE '[0-9a-f]{40}')
          latest=$(git ls-remote "$UPSTREAM" refs/heads/main | cut -f1)
          echo "pinned=$pinned latest=$latest"
          echo "$pinned" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::No DevMate revision pin in Package.swift"; exit 1; }
          echo "$latest" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::Could not read DevMate main"; exit 1; }
          echo "revision=$latest" >> "$GITHUB_OUTPUT"
          if [ "$pinned" = "$latest" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: macos-26
    permissions:
      contents: read
    env:
      REVISION: ${{ needs.check.outputs.revision }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select newest Xcode 26
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"

      - name: Move the pin to DevMate main
        run: |
          sed -i '' -E "s/(devmate\.git\", revision: \")[0-9a-f]{40}/\1$REVISION/" Package.swift
          grep -q "revision: \"$REVISION\"" Package.swift

      - name: Build
        run: swift build -c release --product "$APP_PRODUCT"

      - name: Test
        run: swift test

  publish:
    needs: [check, build]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    env:
      REVISION: ${{ needs.check.outputs.revision }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Move the pin and open or update the pull request
        id: pin
        run: |
          sed -i -E "s/(devmate\.git\", revision: \")[0-9a-f]{40}/\1$REVISION/" Package.swift
          if git diff --quiet -- Package.swift; then echo "Already at $REVISION"; echo "moved=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          [ "$(git diff --numstat | wc -l)" -eq 1 ] || { echo "::error::Unexpected changes"; exit 1; }
          short=${REVISION:0:7}
          old=$(git show HEAD:Package.swift | grep -oE 'devmate\.git", revision: "[0-9a-f]{40}"' | grep -oE '[0-9a-f]{40}')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -am "Follow DevMate main to $short"
          git push --force origin "$BRANCH"
          body="Moves the DevMate pin to focusedsystems/devmate@$REVISION.

          What changed upstream: https://github.com/focusedsystems/devmate/compare/$old...$REVISION

          The devmate-sync build job built the app and ran its tests against that revision. This merges once ci.yml passes on it.

          Risk: low — only the pin changes, and reverting the commit restores the previous revision."
          if [ "$(gh pr view "$BRANCH" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$BRANCH" --title "Follow DevMate main to $short" --body "$body"
          else
            gh pr create --base main --head "$BRANCH" --title "Follow DevMate main to $short" --body "$body"
          fi
          echo "moved=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run ci.yml on that commit and merge it only if it passes
        if: steps.pin.outputs.moved == 'true'
        env:
          SHA: ${{ steps.pin.outputs.sha }}
        run: |
          gh workflow run ci.yml --ref "$BRANCH"
          run=""
          for _ in $(seq 1 30); do
            run=$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch --commit "$SHA" --limit 1 --json databaseId -q '.[0].databaseId')
            [ -n "$run" ] && break
            sleep 10
          done
          [ -n "$run" ] || { echo "::error::ci.yml did not start on $SHA"; exit 1; }
          gh run watch "$run" --exit-status --interval 30
          gh pr merge "$BRANCH" --squash --delete-branch --match-head-commit "$SHA"
